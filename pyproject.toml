[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corvus-crossover"
version = "0.3.0"
description = "Source-only reproducible ECG training, evaluation and negative-transfer evidence"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "torch>=2.6,<3"]

[project.optional-dependencies]
data = ["h5py>=3.10,<4", "wfdb>=4.1,<5", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]
lab = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "onnx>=1.16,<2", "onnxruntime>=1.20,<2", "onnxscript>=0.3,<1"]

[project.scripts]
corvus = "corvus.cli:main"
corvus-lab = "corvus.lab.cli:main"
corvus-repeatability = "corvus.repeatability:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corvus.lab" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
