name: Reproduce artificial fixtures and audit release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU research environment
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-lab-lock.txt
          python -m pip install --no-deps -e .
      - name: Tests and public artifact hygiene
        run: |
          python -m pytest -q
          python scripts/audit_release.py
          python -m compileall -q src scripts
      - name: Reproduce smoke from synthetic fixtures
        run: python scripts/reproduce_smoke.py --work "$RUNNER_TEMP/corvus-smoke"
